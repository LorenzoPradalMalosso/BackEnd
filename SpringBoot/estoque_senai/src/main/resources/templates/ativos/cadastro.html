<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novo ativo</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div th:replace="~{fragmentos/header :: header}"></div>

    <main class="pagina centralizado">
        <section class="card card-form">
            <h1>Novo ativo patrimonial</h1>
            <div th:replace="~{fragmentos/mensagens :: mensagens}"></div>

            <form method="post" th:action="@{/ativos/salvar}" class="formulario">
                <label for="nome">Nome</label>
                <input id="nome" name="nome" type="text" maxlength="120" required>

                <label for="descricao">Descricao</label>
                <textarea id="descricao" name="descricao" rows="4"></textarea>

                <label for="numeroPatrimonio">Numero do patrimonio</label>
                <input id="numeroPatrimonio" name="numeroPatrimonio" type="text" maxlength="50" required>

                <label for="localizacao">Localizacao</label>
                <input id="localizacao" name="localizacao" type="text" maxlength="120" required>

                <label for="situacao">Situacao</label>
                <input id="situacao" name="situacao" type="text" maxlength="60" required>

                <label for="dataCadastro">Data de cadastro</label>
                <input id="dataCadastro" name="dataCadastro" type="date">

                <label for="categoriaId">Categoria</label>
                <select id="categoriaId" name="categoriaId" required>
                    <option value="">Selecione</option>
                    <option th:each="categoria : ${categorias}" th:value="${categoria.id}" th:text="${categoria.nome}"></option>
                </select>

                <button class="botao" type="submit">Salvar ativo</button>
            </form>
        </section>
    </main>

    <div th:replace="~{fragmentos/footer :: footer}"></div>
</body>
</html>
