<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar categoria</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div th:replace="~{fragmentos/header :: header}"></div>

    <main class="pagina centralizado">
        <section class="card card-form">
            <h1>Editar categoria</h1>
            <div th:replace="~{fragmentos/mensagens :: mensagens}"></div>

            <form method="post" th:action="@{/categorias/atualizar/{id}(id=${categoria.id})}" class="formulario">
                <label for="nome">Nome</label>
                <input id="nome" name="nome" type="text" maxlength="80" required th:value="${categoria.nome}">

                <label for="descricao">Descricao</label>
                <textarea id="descricao" name="descricao" rows="4" th:text="${categoria.descricao}"></textarea>

                <button class="botao" type="submit">Atualizar categoria</button>
            </form>
        </section>
    </main>

    <div th:replace="~{fragmentos/footer :: footer}"></div>
</body>
</html>
