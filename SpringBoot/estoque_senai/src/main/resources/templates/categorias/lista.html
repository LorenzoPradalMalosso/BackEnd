<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Categorias</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div th:replace="~{fragmentos/header :: header}"></div>

    <main class="pagina">
        <section class="container cabecalho-pagina">
            <div>
                <h1>Categorias</h1>
                <p class="subtitulo">Cadastre e organize os grupos de materiais e ativos.</p>
            </div>
            <a class="botao" th:href="@{/categorias/nova}">Nova categoria</a>
        </section>

        <section class="container card">
            <div th:replace="~{fragmentos/mensagens :: mensagens}"></div>

            <div class="tabela-responsiva">
                <table class="tabela">
                    <thead>
                        <tr>
                            <th>Nome</th>
                            <th>Descricao</th>
                            <th>Acoes</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="categoria : ${categorias}">
                            <td th:text="${categoria.nome}"></td>
                            <td th:text="${categoria.descricao}"></td>
                            <td class="acoes-tabela">
                                <a th:href="@{/categorias/editar/{id}(id=${categoria.id})}">Editar</a>
                                <a th:href="@{/categorias/excluir/{id}(id=${categoria.id})}" onclick="return confirm('Deseja excluir esta categoria?')">Excluir</a>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(categorias)}">
                            <td colspan="3">Nenhuma categoria cadastrada.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <div th:replace="~{fragmentos/footer :: footer}"></div>
</body>
</html>
