<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movimentacoes</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div th:replace="~{fragmentos/header :: header}"></div>

    <main class="pagina">
        <section class="container cabecalho-pagina">
            <div>
                <h1>Movimentacoes de estoque</h1>
                <p class="subtitulo">Historico de entradas e saidas registradas pelos funcionarios.</p>
            </div>
            <div class="acoes">
                <a class="botao" th:href="@{/movimentacoes/entrada}">Nova entrada</a>
                <a class="botao botao-claro" th:href="@{/movimentacoes/saida}">Nova saida</a>
            </div>
        </section>

        <section class="container card">
            <div th:replace="~{fragmentos/mensagens :: mensagens}"></div>

            <div class="tabela-responsiva">
                <table class="tabela">
                    <thead>
                        <tr>
                            <th>Data</th>
                            <th>Tipo</th>
                            <th>Material</th>
                            <th>Quantidade</th>
                            <th>Funcionario</th>
                            <th>Observacao</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="movimentacao : ${movimentacoes}">
                            <td th:text="${movimentacao.data}"></td>
                            <td>
                                <span class="badge" th:classappend="${movimentacao.tipo == 'SAIDA'} ? ' badge-erro' : ' badge-sucesso'" th:text="${movimentacao.tipo}"></span>
                            </td>
                            <td th:text="${movimentacao.produto.nome}"></td>
                            <td th:text="${movimentacao.quantidade}"></td>
                            <td th:text="${movimentacao.funcionario.nome}"></td>
                            <td th:text="${movimentacao.observacao}"></td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(movimentacoes)}">
                            <td colspan="6">Nenhuma movimentacao registrada.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <div th:replace="~{fragmentos/footer :: footer}"></div>
</body>
</html>
