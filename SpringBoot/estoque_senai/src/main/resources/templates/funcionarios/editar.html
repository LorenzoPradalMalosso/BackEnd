<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar funcionario</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div th:replace="~{fragmentos/header :: header}"></div>

    <main class="pagina centralizado">
        <section class="card card-form">
            <h1>Editar funcionario</h1>
            <div th:replace="~{fragmentos/mensagens :: mensagens}"></div>

            <form method="post" th:action="@{/funcionarios/atualizar/{id}(id=${funcionario.id})}" class="formulario">
                <label for="nome">Nome</label>
                <input id="nome" name="nome" type="text" maxlength="120" required th:value="${funcionario.nome}">

                <label for="nif">NIF</label>
                <input id="nif" name="nif" type="text" th:value="${funcionario.nif}" readonly>

                <label for="cargo">Cargo</label>
                <input id="cargo" name="cargo" type="text" maxlength="80" required th:value="${funcionario.cargo}">

                <label for="novaSenha">Nova senha</label>
                <input id="novaSenha" name="novaSenha" type="password" minlength="4">

                <input type="hidden" name="ativo" value="false">
                <label class="checkbox-linha" for="ativo">
                    <input id="ativo" name="ativo" type="checkbox" value="true" th:checked="${funcionario.ativo}">
                    Funcionario ativo
                </label>

                <button class="botao" type="submit">Atualizar funcionario</button>
            </form>
        </section>
    </main>

    <div th:replace="~{fragmentos/footer :: footer}"></div>
</body>
</html>
