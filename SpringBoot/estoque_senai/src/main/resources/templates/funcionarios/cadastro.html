<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de funcionario</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div th:replace="~{fragmentos/header :: header}"></div>

    <main class="pagina centralizado">
        <section class="card card-form">
            <h1>Cadastro de acesso</h1>
            <p class="subtitulo">
                O cadastro so e permitido para funcionarios que estao na lista de autorizados.
            </p>

            <div th:replace="~{fragmentos/mensagens :: mensagens}"></div>

            <form method="post" th:action="@{/cadastro}" class="formulario">
                <label for="nome">Nome</label>
                <input id="nome" name="nome" type="text" maxlength="120" required>

                <label for="nif">NIF</label>
                <input id="nif" name="nif" type="text" maxlength="20" required>

                <label for="senha">Senha</label>
                <input id="senha" name="senha" type="password" minlength="4" required>

                <button class="botao" type="submit">Cadastrar</button>
            </form>

            <p class="texto-menor">
                Ja possui cadastro?
                <a th:href="@{/login}">Fazer login</a>
            </p>
        </section>
    </main>

    <div th:replace="~{fragmentos/footer :: footer}"></div>
</body>
</html>
