<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quiz com API</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="container">
    <section class="card">
      <h1>Quiz com API</h1>
      <p class="subtitulo">Escolha a quantidade de perguntas e teste seus conhecimentos.</p>

      <div class="config" id="configuracao">
        <label for="numeroPerguntas">Número de perguntas:</label>
        <input type="number" id="numeroPerguntas" min="1" max="50" placeholder="Ex: 10" />
        <button id="btnIniciar">Iniciar Quiz</button>
        <p id="mensagem" class="mensagem"></p>
      </div>

      <div id="quiz" class="quiz oculto">
        <div class="topo-quiz">
          <span id="contador">Pergunta 1 de 10</span>
          <span id="pontuacao">Acertos: 0</span>
        </div>

        <h2 id="pergunta" class="pergunta"></h2>

        <div id="alternativas" class="alternativas"></div>

        <p id="feedback" class="feedback"></p>

        <div class="acoes">
          <button id="btnProxima" class="oculto">Próxima pergunta</button>
        </div>
      </div>

      <div id="resultadoFinal" class="resultado-final oculto"></div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
